<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transfer Results | Masarra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/header.css"><link rel="stylesheet" href="css/footer.css"><link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/hotel-results.css"><link rel="stylesheet" href="css/transfer-results.css">
</head>
<body data-module="transfer-results">
  <div id="app-header"></div>
  <main class="page-offset hr-page tr-page">
    <section class="hr-summary" aria-label="Search summary">
      <div class="hr-wrap" id="trSummary"></div>
      <div class="hr-summary__bar"><div class="hr-wrap"><button class="hr-modify" id="hrModify" type="button"></button></div></div>
    </section>
    <div class="hr-wrap hr-layout">
      <div class="hr-overlay" id="hrOverlay"></div>
      <aside class="hr-filters" id="hrFilters" aria-label="Filters"></aside>
      <section class="hr-results" aria-live="polite">
        <div class="tr-top"><button class="hr-filterbtn" id="hrOpenFilters" type="button"></button><div class="tr-tabs" id="trTabs" role="tablist" hidden></div>
          <label class="tr-sort" id="trSort"><span>Sort by</span><select id="sortPrice" aria-label="Sort by price"><option value="asc">Price: Low to High</option><option value="desc">Price: High to Low</option></select></label></div>
        <div id="hrList"></div>
      </section>
    </div>
  </main>
  <div class="tr-bar" id="trBar" role="region" aria-label="Round trip booking summary" hidden></div>
  <div id="app-footer"></div>
  <div id="app-overlays"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
